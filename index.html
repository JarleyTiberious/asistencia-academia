<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academia Pirineos — Control de Asistencia</title>
    
    <style>
      /* Fondo oscuro general */
      body, html, #root, main {
        background-color: #0F172A !important;
        color: #F8FAFC !important;
        font-family: 'Montserrat', sans-serif !important;
        margin: 0;
        padding: 0;
      }

      /* Transformar paneles y tarjetas blancas a gris slate texturizado */
      div, fieldset, .ap-card, .bg-white {
        background-color: #1E293B !important;
        color: #F8FAFC !important;
        border-color: #334155 !important;
      }

      /* Listas, selectores y contenedores internos aún más oscuros para contraste */
      div[style*="background-color: rgb(255, 255, 255)"], ul, li {
        background-color: #111827 !important;
        color: #F8FAFC !important;
        border-color: #1F2937 !important;
      }

      /* Textos secundarios en gris claro elegante */
      p, span, label, small, th {
        color: #94A3B8 !important;
      }
      
      td, h1, h2, h3, strong {
        color: #F8FAFC !important;
      }

      /* Forzar el naranja de la academia en los botones principales y activos */
      button, .ap-btn-primary, button[style*="background"], .active {
        background-color: #FF6B35 !important;
        color: #FFFFFF !important;
        border-color: #FF6B35 !important;
      }
      
      /* Inputs y campos de formulario perfectamente integrados */
      input, select, textarea {
        background-color: #1E293B !important;
        color: #F8FAFC !important;
        border: 1px solid #334155 !important;
        border-radius: 8px;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
